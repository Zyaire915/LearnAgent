services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: learnagent-postgres
    environment:
      POSTGRES_DB: learnagent
      POSTGRES_USER: learnagent
      POSTGRES_PASSWORD: learnagent
    ports:
      - "5432:5432"
    volumes:
      - learnagent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnagent -d learnagent"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  learnagent_pgdata:
